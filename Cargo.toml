[package]
name = "foxrun"
version = "0.1.0"
edition = "2024"
description = "Local long-running process deduplicator"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
fs2 = "0.4"
humantime = "2.1"
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.43", features = ["full"] }

[dev-dependencies]
tempfile = "3.15"
